<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Calendar App</h1>
      <p>Manage your events and stay organized</p>
    </header>

    <div class="main-content">
      <div class="calendar-section">
        <div class="calendar-header">
          <button id="prevBtn" class="nav-btn">← Previous</button>
          <h2 id="monthYear"></h2>
          <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
        <div class="weekdays">
          <div class="weekday">Sun</div>
          <div class="weekday">Mon</div>
          <div class="weekday">Tue</div>
          <div class="weekday">Wed</div>
          <div class="weekday">Thu</div>
          <div class="weekday">Fri</div>
          <div class="weekday">Sat</div>
        </div>
        <div class="days" id="calendarDays"></div>
      </div>

      <div class="events-section">
        <h3>Add New Event</h3>
        <form id="eventForm">
          <input type="text" id="eventTitle" placeholder="Event title" required>
          <input type="date" id="eventDate" required>
          <input type="time" id="eventTime" value="09:00">
          <textarea id="eventDesc" placeholder="Description (optional)" rows="2"></textarea>
          <button type="submit" class="btn-add">Add Event</button>
        </form>

        <h3>Upcoming Events</h3>
        <div id="eventsList" class="events-list"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
